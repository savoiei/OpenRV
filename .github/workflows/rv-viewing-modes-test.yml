name: OpenRV Viewing Modes Test (trial)

on:
  pull_request:
  workflow_dispatch:

jobs:
  viewing-modes-test:
    name: 'rv-viewing-modes-test (macos-14 arm64 CY2025 Release)'
    runs-on: macos-14
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        with:
          arch-type: "arm64"
          build-type: "Release"
          qt-version: "6.5.3"
          qt-version-short: "6.5"
          python-version: "3.11"
          cmake-version: "3.31.6"
          vfx-platform: "CY2025"

      - name: Install oiiotool
        run: brew install openimageio
        shell: bash

      - name: Verify built RV.app location
        run: ls -la "$(pwd)/_install/RV.app/Contents/MacOS/rvio"
        shell: bash

      - name: DEBUG - rvio -swRenderer smoke test (single trivial render)
        run: |
          RVIO="$(pwd)/_install/RV.app/Contents/MacOS/rvio"
          "$RVIO" -swRenderer "smptebars,width=256,height=144,depth=16f,fps=24.0,start=1,end=1.movieproc" \
            -o /tmp/smoke-sw.#.exr -t 1 -outhalf -err-to-out
        shell: bash

      - name: Run rv-viewing-modes-test
        run: python3 src/test/rv-viewing-modes-test/rv_viewing_modes_test.py --rv "$(pwd)/_install/RV.app" --sw-renderer
        shell: bash

      # TEMPORARY (trial): regenerate the layout goldens under -swRenderer so
      # they match what this CI runner actually renders, instead of the
      # GPU-rendered goldens checked in from local macOS. Remove this step
      # and the upload step below once the new goldens are committed.
      - name: TEMP - regenerate layout goldens under -swRenderer
        if: always()
        run: python3 src/test/rv-viewing-modes-test/rv_viewing_modes_test.py --rv "$(pwd)/_install/RV.app" --generate --sw-renderer --filter layout
        shell: bash

      - name: TEMP - upload regenerated layout goldens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-goldens-sw-renderer
          path: src/test/rv-viewing-modes-test/goldens/layout

      - name: DEBUG - dump rvio per-case logs
        if: always()
        run: |
          find src/test/rv-viewing-modes-test/out -name '*.log' -print -exec cat {} \; || echo "no per-case logs found"
        shell: bash
